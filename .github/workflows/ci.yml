name: CI

# Se ejecuta en cada push y en cada pull request
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:

  # ------------------------------------------------------------------
  # 1) Pruebas de la tienda (Laravel / PHPUnit)
  # ------------------------------------------------------------------
  laravel-tests:
    name: Pruebas Laravel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, curl, dom, fileinfo
          coverage: none

      - name: Instalar dependencias (Composer)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar pruebas
        run: php artisan test

  # ------------------------------------------------------------------
  # 2) Pruebas del microservicio de IA (Python)
  # ------------------------------------------------------------------
  ia-tests:
    name: Pruebas microservicio IA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ia-service
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ia-service/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

  # ------------------------------------------------------------------
  # 3) Build de las imágenes y prueba de integración
  #    (web + microservicio IA + base de datos funcionando juntos)
  # ------------------------------------------------------------------
  docker-integration:
    name: Build y pruebas de integración (Docker Compose)
    runs-on: ubuntu-latest
    needs: [laravel-tests, ia-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Crear .env.docker con una APP_KEY nueva
        run: |
          cp .env.docker.example .env.docker
          KEY="base64:$(openssl rand -base64 32)"
          sed -i "s|^APP_KEY=.*|APP_KEY=${KEY}|" .env.docker

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar servicios y esperar a que estén sanos
        run: docker compose up -d --wait --wait-timeout 240

      - name: Cargar datos de prueba
        run: docker compose exec -T web php artisan db:seed --force

      - name: Pruebas de integración (humo)
        run: bash scripts/smoke-test.sh

      - name: Mostrar registros si algo falló
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar y limpiar
        if: always()
        run: docker compose down -v
